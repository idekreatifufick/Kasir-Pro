  <style>
    :root {
      --theme-from: #991B1B;
      --theme-via: #DC2626;
      --theme-to: #7F1D1D;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC; color: #0F172A;
      overflow-x: hidden;
    }
    #app-root { position: relative; z-index: 9999; min-height: 100vh; background: #F8FAFC; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .theme-gradient { background: linear-gradient(135deg, var(--theme-from) 0%, var(--theme-via) 55%, var(--theme-to) 100%); }
    .theme-gradient-btn { background: linear-gradient(135deg, var(--theme-via) 0%, var(--theme-from) 100%); }

    /* Micro-animation */
    .btn-micro {
      position: relative;
      overflow: hidden;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .btn-micro::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -75%;
      width: 50%;
      height: 200%;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.38) 50%, transparent 100%);
      transform: skewX(-25deg);
      transition: left 0.48s ease;
      pointer-events: none;
    }
    .btn-micro:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -6px rgba(15, 23, 42, 0.22); filter: brightness(1.04); }
    .btn-micro:hover::after { left: 135%; }
    .btn-micro:active { transform: scale(0.94) !important; box-shadow: 0 3px 8px -2px rgba(15, 23, 42, 0.2); }

    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12); }

    /* Skeleton Screen Shimmer */
    @keyframes shimmerMove {
      0% { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #E2E8F0 20%, #F8FAFC 50%, #E2E8F0 80%);
      background-size: 600px 100%;
      animation: shimmerMove 1.35s infinite linear;
      border-radius: 0.75rem;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-enter { animation: toastIn 0.24s ease-out forwards; }

    /* Animasi Panel Backup & Bluetooth */
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes pulseRing { 0% { transform: scale(0.92); opacity: 0.7; } 70% { transform: scale(1.25); opacity: 0; } 100% { transform: scale(1.25); opacity: 0; } }
    @keyframes flowPacket { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
    .anim-float { animation: floatSlow 3.2s ease-in-out infinite; }
    .anim-pulse-ring { animation: pulseRing 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite; }
    .anim-flow-line { stroke-dasharray: 6 6; animation: flowPacket 1s linear infinite; }

    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: #fff !important; padding: 16px !important; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>

  <script type="module">
    const IS_PREVIEW = false; // Ubah ke false saat rilis ke publik

    const firebaseConfig = {
     apiKey: "AIzaSyCI_bZiMcJQ1AQBNexRdUnlXUxFPxY_4mk",
  authDomain: "aplikasi-kasir-pro-v1.firebaseapp.com",
  projectId: "aplikasi-kasir-pro-v1",
  storageBucket: "aplikasi-kasir-pro-v1.firebasestorage.app",
  messagingSenderId: "435586923519",
  appId: "1:435586923519:web:06a925f8cf5b5100c545ca"
};

    function safeIcons(scopeEl = null) {
      try {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          if (scopeEl) window.lucide.createIcons({ nodes: [scopeEl] });
          else window.lucide.createIcons();
        }
      } catch (_) {}
    }

    (function setupPWA() {
      try {
        const manifest = {
          name: "Sistem Kasir & Manajemen Usaha",
          short_name: "KasirPro",
          start_url: "./",
          display: "standalone",
          background_color: "#F8FAFC",
          theme_color: "#B91C1C",
          description: "Sistem Kasir & Manajemen Usaha (POS) Real-Time",
          icons: [
            {
              src: "https://lh3.googleusercontent.com/d/1wDMK5bM0nAGnaUExReMYWphqkXDivBPM",
              sizes: "192x192",
              type: "image/jpeg",
              purpose: "any maskable"
            },
            {
              src: "https://lh3.googleusercontent.com/d/1wDMK5bM0nAGnaUExReMYWphqkXDivBPM",
              sizes: "512x512",
              type: "image/jpeg",
              purpose: "any maskable"
            }
          ]
        };
        const manifestEl = document.getElementById("pwa-manifest");
        if (manifestEl) {
          manifestEl.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
        }
        
        // MEMANGGIL FILE sw.js FISIK
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log("PWA SW Register Error", err);
          });
        }
      } catch (_) {}
    })();

    // TEMA & PERMISSIONS
    const THEMES = {
      crimson: { name: "Merah Kirmizi", from: "#991B1B", via: "#DC2626", to: "#7F1D1D", badge: "bg-red-600" },
      teal:    { name: "Ocean Teal",    from: "#0F766E", via: "#0D9488", to: "#115E59", badge: "bg-teal-600" },
      indigo:  { name: "Royal Indigo",  from: "#3730A3", via: "#4F46E5", to: "#312E81", badge: "bg-indigo-600" },
      emerald: { name: "Emerald Hijau", from: "#047857", via: "#10B981", to: "#065F46", badge: "bg-emerald-600" },
      orange:  { name: "Sunset Oranye", from: "#C2410C", via: "#F97316", to: "#9A3412", badge: "bg-orange-600" }
    };

    const PERMISSION_GROUPS = [
      {
        title: "Transaksi & Penjualan",
        items: [
          { key: "pos", label: "Penjualan / Kasir" },
          { key: "cancelTrx", label: "Pembatalan Transaksi" },
          { key: "printReceipt", label: "Cetak Struk" },
          { key: "editPrice", label: "Edit Harga Saat Transaksi" }
        ]
      },
      {
        title: "Menu & Kategori",
        items: [
          { key: "viewMenu", label: "Lihat Menu & Kategori" },
          { key: "addMenu", label: "Tambah Menu" },
          { key: "editMenu", label: "Edit Menu" },
          { key: "deleteMenu", label: "Hapus Menu" },
          { key: "manageCategory", label: "Atur Kategori" }
        ]
      },
      {
        title: "Pengelolaan Kas",
        items: [
          { key: "cashIn", label: "Kas Masuk" },
          { key: "cashOut", label: "Kas Keluar (Pengeluaran)" },
          { key: "manageCash", label: "Edit / Hapus Data Kas" }
        ]
      },
      {
        title: "Laporan & Data",
        items: [
          { key: "viewReport", label: "Lihat Laporan" },
          { key: "exportReport", label: "Ekspor Laporan (PDF/Excel)" },
          { key: "sendWaReport", label: "Kirim Laporan ke WhatsApp" }
        ]
      },
      {
        title: "Manajemen Data",
        items: [
          { key: "deleteTrxData", label: "Hapus Data Transaksi" },
          { key: "deleteCashData", label: "Hapus Data Kas Masuk/Keluar" },
          { key: "optimizeStorage", label: "Kelola Penyimpanan (Optimasi)" }
        ]
      },
      {
        title: "Pengaturan Sistem",
        items: [
          { key: "editBusiness", label: "Pengaturan Usaha" },
          { key: "manageUsers", label: "Kelola Pengguna & Hak Akses" },
          { key: "editTheme", label: "Ubah Tema / Warna Aplikasi" }
        ]
      }
    ];

    const ACCESS_TEMPLATES = {
      "Kasir (Operasional)": {
        pos: true, cancelTrx: true, printReceipt: true, editPrice: false,
        viewMenu: true, addMenu: true, editMenu: true, deleteMenu: false, manageCategory: true,
        cashIn: true, cashOut: true, manageCash: false,
        viewReport: true, exportReport: false, sendWaReport: false,
        deleteTrxData: false, deleteCashData: false, optimizeStorage: false,
        editBusiness: false, manageUsers: false, editTheme: false
      },
      "Admin Outlet": {
        pos: true, cancelTrx: true, printReceipt: true, editPrice: true,
        viewMenu: true, addMenu: true, editMenu: true, deleteMenu: true, manageCategory: true,
        cashIn: true, cashOut: true, manageCash: true,
        viewReport: true, exportReport: true, sendWaReport: true,
        deleteTrxData: false, deleteCashData: false, optimizeStorage: false,
        editBusiness: false, manageUsers: false, editTheme: false
      },
      "Admin Laporan": {
        pos: false, cancelTrx: false, printReceipt: true, editPrice: false,
        viewMenu: true, addMenu: false, editMenu: false, deleteMenu: false, manageCategory: false,
        cashIn: false, cashOut: false, manageCash: false,
        viewReport: true, exportReport: true, sendWaReport: true,
        deleteTrxData: false, deleteCashData: false, optimizeStorage: false,
        editBusiness: false, manageUsers: false, editTheme: false
      }
    };

    const ALL_TRUE_PERMS = Object.fromEntries(PERMISSION_GROUPS.flatMap(g => g.items.map(i => [i.key, true])));
    const todayIso = () => new Date().toISOString().slice(0, 10);
    const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

    // APP STATE
    const state = {
      loading: false,
      user: null,
      loginTab: "Owner",
      activePage: "dashboard",
      posSubTab: "kasir",
      selectedCategory: "Semua",
      menuSearch: "",
      cart: [],
      discount: 0,
      paymentMethod: "Tunai",
      cashReceived: 0,
      lastReceipt: null,
      selectedAdminId: null,
      userPage: 1,
      reportStart: todayIso(),
      reportEnd: todayIso(),

      trxFilterMode: "today",
      trxFilterDate: todayIso(),
      trxFilterMonth: todayIso().slice(0, 7),
      trxFilterYear: String(new Date().getFullYear()),
      trxPayMethodFilter: "Semua",
      trxSearch: "",

      ownerCashFilter: "all",
      ownerCashSearch: "",
      ownerPeriodMode: "all",
      ownerDateStart: todayIso(),
      ownerDateEnd: todayIso(),
      ownerMonth: todayIso().slice(0, 7),
      ownerYear: String(new Date().getFullYear()),

      settings: {
        businessName: "Nama Usaha Anda",
        logoUrl: "",
        whatsappOwner: "",
        autoSendReceiptWa: true,
        receiptShowLogo: true,
        receiptShowCashier: true,
        receiptHeaderName: "NAMA USAHA ANDA",
        receiptAddress: "",
        receiptFooter: "Terima Kasih Sudah Berbelanja!",
        themeColor: "crimson",
        qrisImageUrl: "",
        bankInfo: "",
        ewalletInfo: "",
        paymentMethods: ["Tunai", "QRIS", "Transfer Bank", "E-Wallet"],
        backupFolderUrl: "",
        lastBackupAt: ""
      },
      isBackingUp: false,
      btPrinterConnected: false,
      btPrinterConnecting: false,
      btPrinterName: "",
      categories: [],
      menus: [],
      transactions: [],
      cashFlows: [],
      ownerCashFlows: [],
      users: []
    };
    window.state = state;

    const hasPerm = (key) => {
      if (!state.user) return false;
      if (state.user.role === "Owner") return true;
      return Boolean(state.user.permissions && state.user.permissions[key]);
    };
    const isOwnerRole = () => state.user && state.user.role === "Owner";

    // NOTIFIKASI INSTALL PWA
    let deferredInstallPrompt = null;
    let pwaBannerDismissed = false;

    function isAppAlreadyInstalled() {
      try {
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true || document.referrer.includes("android-app://");
      } catch (_) {
        return false;
      }
    }

    function showPwaInstallBanner() {
      const bannerEl = document.getElementById("pwa-install-banner");
      if (!bannerEl || isAppAlreadyInstalled() || pwaBannerDismissed) return;
      const appTitle = state.settings.businessName || "Sistem Kasir";
      const appLogo = state.settings.logoUrl;
      bannerEl.className = "fixed bottom-20 lg:bottom-5 left-3 right-3 lg:left-auto lg:right-5 lg:max-w-md z-[9998] toast-enter";
      bannerEl.innerHTML = `
        <div class="bg-slate-900/95 text-white backdrop-blur-md rounded-2xl p-4 shadow-2xl border border-white/15 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl theme-gradient flex items-center justify-center shrink-0 overflow-hidden border border-white/25 shadow-md">
            ${appLogo ? `<img src="${esc(appLogo)}" class="w-full h-full object-cover" />` : `<i data-lucide="smartphone" class="w-6 h-6 text-white"></i>`}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-full bg-amber-400 text-slate-900 text-[10px] font-extrabold">REKOMENDASI</span>
              <span class="text-[11px] text-slate-300 font-semibold truncate">Akses Lebih Cepat</span>
            </div>
            <p class="font-extrabold text-xs sm:text-sm text-white truncate mt-0.5">Instal Aplikasi Ini</p>
            <p class="text-[11px] text-slate-300 leading-snug line-clamp-2">Pasang <b>${esc(appTitle)}</b> ke layar utama HP/Desktop agar full-screen tanpa browser.</p>
          </div>
          <div class="flex flex-col gap-1.5 shrink-0">
            <button type="button" onclick="window.triggerPwaInstall()" class="btn-micro px-3.5 py-2 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 text-xs font-extrabold flex items-center justify-center gap-1 shadow">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> Instal
            </button>
            <button type="button" onclick="window.dismissPwaBanner()" class="text-[11px] text-slate-400 hover:text-white font-semibold text-center py-0.5">Nanti saja</button>
          </div>
        </div>
      `;
      safeIcons(bannerEl);
    }

    window.dismissPwaBanner = function() {
      pwaBannerDismissed = true;
      const bannerEl = document.getElementById("pwa-install-banner");
      if (bannerEl) { bannerEl.className = "hidden"; bannerEl.innerHTML = ""; }
    };

    window.triggerPwaInstall = async function() {
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          if (choice && choice.outcome === "accepted") {
            window.dismissPwaBanner();
            showToast("Aplikasi Diinstal!", "Aplikasi ditambahkan ke layar utama.", "success");
          }
        } catch (_) {}
        return;
      }
      const ios = /iphone|ipad|ipod/i.test(window.navigator.userAgent || "");
      openModal(`
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="w-10 h-10 rounded-2xl theme-gradient text-white flex items-center justify-center shrink-0">
                <i data-lucide="download" class="w-5 h-5"></i>
              </span>
              <div>
                <h3 class="font-extrabold text-sm text-slate-900">Instal Aplikasi ke Perangkat</h3>
                <p class="text-[11px] text-slate-500">${ios ? "Panduan Browser Safari (iOS)" : "Panduan Browser Chrome/Edge"}</p>
              </div>
            </div>
            <button type="button" onclick="window.closeModal()" class="p-1.5 rounded-xl bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5 text-xs text-slate-700 leading-relaxed">
            ${ios ? `
              <p>1. Ketuk ikon <b>Bagikan (Share)</b> di bawah Safari.</p>
              <p>2. Gulir & pilih <b>"Tambahkan ke Layar Utama"</b>.</p>
              <p>3. Ketuk <b>Tambah (Add)</b> di pojok kanan atas.</p>
            ` : `
              <p>1. Ketuk ikon <b>Titik Tiga &#8942;</b> di pojok kanan browser.</p>
              <p>2. Pilih <b>"Instal aplikasi"</b> atau <b>"Tambahkan ke layar utama"</b>.</p>
              <p>3. Konfirmasi <b>Instal</b>, aplikasi akan muncul di Home Anda.</p>
            `}
          </div>
          <button type="button" onclick="window.closeModal(); window.dismissPwaBanner();" class="btn-micro w-full py-3 rounded-xl theme-gradient-btn text-white text-xs font-extrabold shadow">Mengerti</button>
        </div>
      `);
    };

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      showPwaInstallBanner();
    });
    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      window.dismissPwaBanner();
      showToast("Instalasi Selesai", "Aplikasi siap dibuka dari layar utama.", "success");
    });
    setTimeout(() => { if (!isAppAlreadyInstalled() && !pwaBannerDismissed) showPwaInstallBanner(); }, 1200);

    // UTILS & FIREBASE
    function applyTheme(themeKey) {
      const t = THEMES[themeKey] || THEMES.crimson;
      document.documentElement.style.setProperty("--theme-from", t.from);
      document.documentElement.style.setProperty("--theme-via", t.via);
      document.documentElement.style.setProperty("--theme-to", t.to);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", t.via);
    }
    window.applyTheme = applyTheme;

    function showToast(title, message = "", type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const styles = {
        success: "bg-emerald-600 text-white border-emerald-400",
        error: "bg-rose-600 text-white border-rose-400",
        info: "bg-blue-600 text-white border-blue-400",
        warning: "bg-amber-500 text-slate-900 border-amber-300"
      };
      const icons = { success: "check-circle-2", error: "alert-circle", info: "info", warning: "alert-triangle" };
      const el = document.createElement("div");
      el.className = `toast-enter pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-xl border ${styles[type] || styles.success}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || "check-circle-2"}" class="w-5 h-5 shrink-0 mt-0.5"></i>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-sm leading-tight">${esc(title)}</p>
          ${message ? `<p class="text-xs opacity-90 mt-1 leading-snug">${esc(message)}</p>` : ""}
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
      `;
      container.appendChild(el);
      safeIcons(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-8px)";
        el.style.transition = "all 0.25s ease";
        setTimeout(() => el.remove(), 260);
      }, 3600);
    }
    window.showToast = showToast;

    function openModal(html) {
      const mc = document.getElementById("modal-container");
      mc.innerHTML = html;
      mc.classList.remove("hidden");
      mc.classList.add("flex");
      safeIcons(mc);
    }

    function compressImageFile(file, maxW = 480, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    let unsubscribes = [];
    async function subscribeFirestoreData() {
      if (IS_PREVIEW || !fbDb) return;
      unsubscribes.forEach(u => u());
      unsubscribes = [];
      const { collection, doc, onSnapshot, query, orderBy } = fbTools;

      unsubscribes.push(onSnapshot(doc(fbDb, "settings", "app_config"), (snap) => {
        if (snap.exists()) {
          state.settings = { ...state.settings, ...snap.data() };
          applyTheme(state.settings.themeColor);
          render();
        }
      }));
      unsubscribes.push(onSnapshot(collection(fbDb, "categories"), (snap) => {
        state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }));
      unsubscribes.push(onSnapshot(collection(fbDb, "menus"), (snap) => {
        state.menus = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }));
      unsubscribes.push(onSnapshot(query(collection(fbDb, "transactions"), orderBy("createdAt", "desc")), (snap) => {
        state.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }));
      unsubscribes.push(onSnapshot(query(collection(fbDb, "cash_flows"), orderBy("createdAt", "desc")), (snap) => {
        state.cashFlows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }));
      unsubscribes.push(onSnapshot(query(collection(fbDb, "owner_cash_flows"), orderBy("createdAt", "desc")), (snap) => {
        state.ownerCashFlows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }));
      unsubscribes.push(onSnapshot(collection(fbDb, "users"), (snap) => {
        state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!state.selectedAdminId && state.users.length) state.selectedAdminId = state.users[0].id;
        render();
      }));
    }

    async function dbAdd(colName, data) {
      if (IS_PREVIEW) {
        const id = colName.slice(0, 2) + "_" + Date.now() + Math.floor(Math.random() * 100);
        const item = { id, ...data };
        if (colName === "categories") state.categories.push(item);
        if (colName === "menus") state.menus.unshift(item);
        if (colName === "transactions") state.transactions.unshift(item);
        if (colName === "cash_flows") state.cashFlows.unshift(item);
        if (colName === "owner_cash_flows") state.ownerCashFlows.unshift(item);
        if (colName === "users") state.users.push(item);
        return item;
      } else {
        const { collection, addDoc } = fbTools;
        const ref = await addDoc(collection(fbDb, colName), data);
        return { id: ref.id, ...data };
      }
    }

    async function dbUpdate(colName, id, data) {
      if (IS_PREVIEW) {
        const map = { categories: state.categories, menus: state.menus, transactions: state.transactions, cash_flows: state.cashFlows, owner_cash_flows: state.ownerCashFlows, users: state.users };

        const idx = arr.findIndex(x => x.id === id);
        if (idx > -1) arr[idx] = { ...arr[idx], ...data };
      } else {
        const { doc, updateDoc } = fbTools;
        await updateDoc(doc(fbDb, colName, id), data);
      }
    }

    // 1. DASHBOARD
    function renderDashboard() {
      const today = todayIso();
      const todayAllTrx = state.transactions.filter(t => t.date === today);
      const completedToday = todayAllTrx.filter(t => t.status !== "cancelled");
      const salesToday = completedToday.reduce((s, t) => s + Number(t.total || 0), 0);
      const trxCount = completedToday.length;
      const manualCashInToday = state.cashFlows.filter(c => c.date === today && c.type === "in" && c.status !== "cancelled" && !c.trxId).reduce((s, c) => s + Number(c.amount || 0), 0);
      const cashInToday = salesToday + manualCashInToday;
      const cashOutToday = state.cashFlows.filter(c => c.date === today && c.type === "out" && c.status !== "cancelled").reduce((s, c) => s + Number(c.amount || 0), 0);

    // 2. PENJUALAN (KASIR)
    function getPeriodMatchedTransactions() {
      const today = todayIso();
      const q = (state.trxSearch || "").toLowerCase().trim();
      return state.transactions.filter(t => {
        const d = String(t.date || "");
        if (state.trxFilterMode === "today" && d !== today) return false;
        if (state.trxFilterMode === "date" && state.trxFilterDate && d !== state.trxFilterDate) return false;
        if (state.trxFilterMode === "month" && state.trxFilterMonth && !d.startsWith(state.trxFilterMonth)) return false;
        if (state.trxFilterMode === "year" && state.trxFilterYear && !d.startsWith(state.trxFilterYear)) return false;
        if (q) {
          const hay = `${t.invoiceNo || ""} ${t.cashierName || ""} ${t.paymentMethod || ""} ${(t.items || []).map(i => i.name).join(" ")}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function getFilteredTransactions() {
      return getPeriodMatchedTransactions().filter(t => {
        if (state.trxPayMethodFilter && state.trxPayMethodFilter !== "Semua" && t.paymentMethod !== state.trxPayMethodFilter) return false;
        return true;
      });
    }

    // HELPER LINK WHATSAPP & STRUK & PRINTER BLUETOOTH 58mm
    function buildWhatsAppLinkWithMessage(waLinkOrPhone, encodedText) {
      const raw = String(waLinkOrPhone || "").trim();
      if (!raw) return `https://wa.me/?text=${encodedText}`;
      if (/^https?:\/\//i.test(raw)) {
        try {
          const u = new URL(raw);
          u.searchParams.set("text", decodeURIComponent(encodedText));
          return u.toString();
        } catch (_) {
          const sep = raw.includes("?") ? "&" : "?";
          return `${raw}${sep}text=${encodedText}`;
        }
      }
      const digits = raw.replace(/\D/g, "");
      return `https://wa.me/${digits}?text=${encodedText}`;
    }

    function buildReceiptWhatsAppUrl(trx) {
      const headerName = (state.settings.receiptHeaderName || state.settings.businessName || "USAHA").toUpperCase();
      const addrLine = state.settings.receiptAddress ? `${state.settings.receiptAddress}\n` : "";
      const cashierLine = state.settings.receiptShowCashier !== false ? `Kasir: ${trx.cashierName}\n` : "";
      const footerLine = state.settings.receiptFooter || "Terima Kasih Sudah Berbelanja!";
      const waText = encodeURIComponent(
        `*STRUK ${headerName}*\n` + addrLine + `No: ${trx.invoiceNo}\nTanggal: ${trx.date}\n` + cashierLine +

        `\n--------------------\n` + (Number(trx.discount || 0) > 0 ? `Diskon: -${rp(trx.discount)}\n` : "") +

        `--------------------\n${footerLine}`
      );
      return buildWhatsAppLinkWithMessage(state.settings.whatsappOwner, waText);

    let btPrinterCharacteristic = null;
    let btPrinterDevice = null;

    async function establishBluetoothPrinterConnection() {
      if (!navigator.bluetooth) throw new Error("Perangkat/Browser tidak mendukung Web Bluetooth. Gunakan Chrome/Edge.");
      if (btPrinterCharacteristic && btPrinterDevice?.gatt?.connected) {
        state.btPrinterConnected = true;
        state.btPrinterName = btPrinterDevice.name || state.btPrinterName || "Printer Thermal";
        return btPrinterCharacteristic;
      }
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [ "000018f0-0000-1000-8000-00805f9b34fb", "49535343-fe7d-4ae5-8fa9-9fafd205e455", "e7810a71-73ae-499d-8c15-faa9aef0c3f2" ]
      });
      btPrinterDevice = device;
      device.addEventListener("gattserverdisconnected", () => {
        btPrinterCharacteristic = null;
        state.btPrinterConnected = false;
        render();
        showToast("Printer Terputus", "Koneksi Bluetooth printer struk terputus.", "warning");
      });
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      let foundChar = null;
      for (const svc of services) {
        const chars = await svc.getCharacteristics();
        const writable = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
        if (writable) { foundChar = writable; break; }
      }
      if (!foundChar) throw new Error("Karakteristik cetak printer tidak ditemukan.");
      btPrinterCharacteristic = foundChar;
      state.btPrinterConnected = true;
      state.btPrinterName = device.name || "Printer Thermal 58mm";
      return foundChar;
    }

    function buildEscPosBytes(trx) {
      const enc = new TextEncoder();
      const chunks = [];
      const push = (str) => chunks.push(enc.encode(str));
      const pushBytes = (arr) => chunks.push(new Uint8Array(arr));
      const line32 = (left, right) => {
        const l = String(left).slice(0, 20);
        const r = String(right);
        const space = Math.max(1, 32 - l.length - r.length);
        return l + " ".repeat(space) + r + "\n";
      };
      const headerName = (state.settings.receiptHeaderName || state.settings.businessName || "USAHA").toUpperCase();
      pushBytes([0x1B, 0x40]); pushBytes([0x1B, 0x61, 0x01]); pushBytes([0x1B, 0x45, 0x01]);
      push(headerName + "\n");
      pushBytes([0x1B, 0x45, 0x00]);
      if (state.settings.receiptAddress) push(state.settings.receiptAddress + "\n");
      push("--------------------------------\n");
      pushBytes([0x1B, 0x61, 0x00]);
      push(`No   : ${trx.invoiceNo}\n`);
      push(`Tgl  : ${trx.date}\n`);
      if (state.settings.receiptShowCashier !== false) push(`Kasir: ${trx.cashierName}\n`);
      push("--------------------------------\n");
      trx.items.forEach(i => { push(`${i.name}\n`); push(line32(`  ${i.qty} x ${rp(i.price)}`, rp(i.price * i.qty))); if (i.note) push(`  Catatan: ${i.note}\n`); });
      push("--------------------------------\n");
      if (Number(trx.discount || 0) > 0) push(line32("Diskon", "-" + rp(trx.discount)));
      pushBytes([0x1B, 0x45, 0x01]);
      push(line32(`TOTAL (${trx.paymentMethod})`, rp(trx.total)));
      pushBytes([0x1B, 0x45, 0x00]);
      if (trx.paymentMethod === "Tunai") { push(line32("Tunai", rp(trx.cashReceived))); push(line32("Kembalian", rp(trx.change))); }
      push("--------------------------------\n");
      pushBytes([0x1B, 0x61, 0x01]);
      push((state.settings.receiptFooter || "Terima Kasih Sudah Berbelanja!") + "\n\n\n");
      pushBytes([0x1D, 0x56, 0x41, 0x10]);

      const totalLen = chunks.reduce((s, c) => s + c.length, 0);
      const out = new Uint8Array(totalLen);
      let offset = 0;
      chunks.forEach(c => { out.set(c, offset); offset += c.length; });
      return out;
    }

    window.printBluetoothReceipt = async () => {
      const trx = state.lastReceipt;
      if (!trx) return;
      if (!navigator.bluetooth) {
        showToast("Browser Tidak Mendukung Bluetooth", "Mengalihkan ke cetak standar browser.", "warning");
        window.printReceipt();
        return;
      }
      try {
        if (!btPrinterCharacteristic || !btPrinterDevice?.gatt?.connected) {
          showToast("Mencari Printer Bluetooth", "Pilih printer thermal 58mm Anda...", "info");
          await establishBluetoothPrinterConnection();
          render();
        }
        if (!btPrinterCharacteristic) throw new Error("Karakteristik printer tidak ditemukan.");
        const bytes = buildEscPosBytes(trx);
        const chunkSize = 100;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const slice = bytes.slice(i, i + chunkSize);
          if (btPrinterCharacteristic.properties.writeWithoutResponse) {
            await btPrinterCharacteristic.writeValueWithoutResponse(slice);
          } else {
            await btPrinterCharacteristic.writeValue(slice);
          }
        }
        showToast("Struk Tercetak via Bluetooth", "Struk berhasil dikirim ke printer thermal 58mm.");
        triggerAutoForwardReceiptToOwnerWa(trx);
      } catch (err) {
        showToast("Cetak Bluetooth Dibatalkan / Gagal", err.message || "Pastikan printer Bluetooth aktif.", "error");
      }
    };

    window.openReceiptById = (id) => {

    // ACTIONS (Trx Filter, dll)
    window.setTrxFilterMode = (mode) => { state.trxFilterMode = mode; render(); };
    window.setTrxFilterVal = (field, val) => {
      if (field === "date") state.trxFilterDate = val;
      if (field === "month") state.trxFilterMonth = val;
      if (field === "year") state.trxFilterYear = val;
      render();
    };
    window.setTrxSearch = (q) => { state.trxSearch = q; render(); };
    window.setTrxPayMethodFilter = (method) => {
      state.trxPayMethodFilter = method;
      state.posSubTab = "riwayat";
      window.closeModal();
      render();
    };
    window.openTrxPayMethodFilterModal = () => {
      const baseList = getPeriodMatchedTransactions();
      const configured = state.settings.paymentMethods || ["Tunai", "QRIS", "Transfer Bank", "E-Wallet"];
      const dynamicMethods = Array.from(new Set(["Tunai", "QRIS", "Transfer Bank", "E-Wallet", ...configured, ...baseList.map(t => t.paymentMethod).filter(Boolean)]));
      const allOptions = ["Semua", ...dynamicMethods];

      openModal(`
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
              <h3 class="text-base font-extrabold text-slate-900">Filter Metode Pembayaran</h3>
              <p class="text-xs text-slate-500 mt-0.5">Pilih metode untuk menyaring riwayat pembayaran beserta jumlahnya</p>
            </div>
            <button type="button" onclick="window.closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
            ${allOptions.map((m, idx) => {
              const matched = m === "Semua" ? baseList : baseList.filter(t => t.paymentMethod === m);
              const count = matched.length;
              const sum = matched.filter(t => t.status !== "cancelled").reduce((s, t) => s + Number(t.total || 0), 0);
              const active = state.trxPayMethodFilter === m;
              return `
                <button type="button" onclick="window.selectTrxPayMethodByIdx(${idx})" class="btn-micro w-full p-3.5 rounded-2xl border-2 text-left flex items-center justify-between gap-3 ${active ? 'border-emerald-600 bg-emerald-50/80 text-emerald-950' : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800'}">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="w-8 h-8 rounded-xl ${active ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'} flex items-center justify-center shrink-0">
                      <i data-lucide="${m === 'Semua' ? 'layers' : 'credit-card'}" class="w-4 h-4"></i>
                    </span>
                    <div class="min-w-0">
                      <p class="text-xs font-extrabold truncate">${esc(m === "Semua" ? "Semua Metode Pembayaran" : m)}</p>
                      <p class="text-[11px] text-slate-500 tabular-nums">Total: <b class="text-slate-700">${rp(sum)}</b></p>
                    </div>
                  </div>
                  <span class="px-3 py-1 rounded-full text-xs font-extrabold tabular-nums shrink-0 ${active ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}">${count} Transaksi</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `);
      window._trxMethodFilterOptions = allOptions;
    };
    window.selectTrxPayMethodByIdx = (idx) => {
      const opts = window._trxMethodFilterOptions || ["Semua"];
      window.setTrxPayMethodFilter(opts[idx] || "Semua");
    };
    window.openTodayHistoryInPos = () => {
      state.trxFilterMode = "today";
      state.trxFilterDate = todayIso();
      state.posSubTab = "riwayat";
      window.goPage("pos");

    window.addToCart = (menuId) => {
      const m = state.menus.find(x => x.id === menuId);
      if (!m) return;
      const existing = state.cart.find(c => c.menuId === menuId);
      if (existing) existing.qty += 1;
      else state.cart.push({ menuId: m.id, name: m.name, price: m.price, originalPrice: m.price, qty: 1, note: "" });
      showToast("Ditambahkan ke Keranjang", `${m.name} (+1)`, "success");
      render();
    };
    window.changeCartQty = (idx, delta) => {
      if (!state.cart[idx]) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      render();
    };
    window.removeCartItem = (idx) => { state.cart.splice(idx, 1); render(); };
    window.updateCartNote = (idx, val) => { if (state.cart[idx]) state.cart[idx].note = val; };
    window.promptEditCartPrice = (idx) => {
      const item = state.cart[idx];
      if (!item) return;
      openModal(`
        <form id="edit-price-form" class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-sm text-slate-900">Edit Harga Satuan</h3>
            <button type="button" onclick="window.closeModal()" class="p-1 rounded-lg bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <p class="text-xs text-slate-500">${esc(item.name)}</p>
          <input id="edit-price-input" type="number" min="0" required value="${item.price}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold" />
          <button type="submit" class="btn-micro w-full py-2.5 rounded-xl theme-gradient-btn text-white text-xs font-bold">Simpan Harga</button>
        </form>
      `);
      document.getElementById("edit-price-form").onsubmit = (e) => {
        e.preventDefault();
        const val = Number(document.getElementById("edit-price-input").value);
        if (!isNaN(val) && val >= 0) {
          item.price = val;
          window.closeModal();
          showToast("Harga Diperbarui", `${item.name} menjadi ${rp(item.price)}`, "info");
          render();
        }
      };
    };
    window.setDiscount = (v) => { state.discount = Math.max(0, Number(v || 0)); render(); };
    window.clearCart = () => { state.cart = []; state.discount = 0; showToast("Pesanan Dibatalkan", "Keranjang telah dikosongkan.", "warning"); render(); };

    window.processCheckout = async () => {
      const subtotal = state.cart.reduce((s, c) => s + (c.price * c.qty), 0);
      const total = Math.max(0, subtotal - Number(state.discount || 0));
      if (state.paymentMethod === "Tunai" && state.cashReceived < total) {
        return showToast("Uang Kurang", "Nominal uang diterima lebih kecil dari total bayar.", "error");
      }
      const now = new Date();
      const inv = "SR-" + now.toISOString().slice(0,10).replace(/-/g, "") + "-" + String(Math.floor(1000 + Math.random() * 9000));
      const trx = {
        invoiceNo: inv,
        items: state.cart.map(c => ({ menuId: c.menuId, name: c.name, price: c.price, qty: c.qty, note: c.note })),
        subtotal, discount: state.discount, total,
        cashReceived: state.paymentMethod === "Tunai" ? state.cashReceived : total,
        change: state.paymentMethod === "Tunai" ? Math.max(0, state.cashReceived - total) : 0,
        paymentMethod: state.paymentMethod,
        cashierName: state.user?.fullName || state.user?.username || "Kasir",
        status: "completed",
        date: now.toISOString().slice(0, 10),
        createdAt: now.toISOString()
      };
      const saved = await dbAdd("transactions", trx);
      await dbAdd("cash_flows", {
        trxId: saved.id,
        type: "in",
        title: `Penjualan Kasir (${inv})`,
        amount: trx.total,
        note: `Metode: ${trx.paymentMethod}`,
        photoUrl: "",
        status: "active",
        recordedBy: trx.cashierName,
        date: trx.date,
        createdAt: trx.createdAt
      });
      state.cart = [];
      state.discount = 0;
      window.closeModal();
      showToast("Transaksi & Kas Masuk Tercatat!", `Struk ${inv} (${rp(trx.total)}) masuk ke Kas Harian.`, "success");
      window.openReceiptModal(saved);
      render();
    };

    window.cancelTransaction = (id) => {
      showReasonDialog({
        title: "Batalkan Transaksi",
        subtitle: "Masukkan alasan pembatalan transaksi agar tercatat di riwayat.",
        placeholder: "Contoh: Salah input menu / pelanggan membatalkan pesanan",
        confirmText: "Batalkan Transaksi",
        onSubmit: async (reason) => {
          await dbUpdate("transactions", id, { status: "cancelled", cancelReason: reason });
          const linkedCash = state.cashFlows.find(c => c.trxId === id && c.status !== "cancelled");
          if (linkedCash) {
            await dbUpdate("cash_flows", linkedCash.id, { status: "cancelled", cancelReason: `Transaksi dibatalkan: ${reason}` });
          }
          showToast("Transaksi & Kas Masuk Dibatalkan", `Alasan: ${reason}`, "warning");
          render();
        }

        <div style="max-width:300px;margin:auto;font-family:monospace;font-size:12px;">
          ${state.settings.receiptShowLogo && state.settings.logoUrl ? `<div style="text-align:center;margin-bottom:6px;"><img src="${esc(state.settings.logoUrl)}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;margin:auto;" /></div>` : ""}
          <h3 style="text-align:center;margin:0;">${esc(headerName)}</h3>
          ${state.settings.receiptAddress ? `<p style="text-align:center;margin:2px 0;font-size:11px;">${esc(state.settings.receiptAddress)}</p>` : ""}
          <p style="text-align:center;margin:4px 0;">${esc(t.invoiceNo)}<br/>${esc(t.date)}${state.settings.receiptShowCashier !== false ? ` | Kasir: ${esc(t.cashierName)}` : ""}</p>
          <hr/>
          ${t.items.map(i => `<div>${esc(i.name)} x${i.qty} <span style="float:right">${rp(i.price * i.qty)}</span></div>`).join("")}
          <hr/>
          ${Number(t.discount || 0) > 0 ? `<div>Diskon<span style="float:right">-${rp(t.discount)}</span></div>` : ""}
          <div><b>TOTAL (${esc(t.paymentMethod)})</b><span style="float:right"><b>${rp(t.total)}</b></span></div>
          ${t.paymentMethod === "Tunai" ? `<div>Tunai<span style="float:right">${rp(t.cashReceived)}</span></div><div>Kembali<span style="float:right">${rp(t.change)}</span></div>` : ""}
          <p style="text-align:center;margin-top:12px;">${esc(state.settings.receiptFooter || "Terima Kasih Sudah Berbelanja!")}</p>

    // MANAJEMEN DATA & BACKUP ACTIONS
    function formatBytes(bytes) {
      const b = Number(bytes || 0);
      if (b < 1024) return b + " B";
      if (b < 1024 * 1024) return (b / 1024).toFixed(2) + " KB";
      if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(2) + " MB";
      return (b / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function calculateDatabaseUsage() {
      const encoder = new TextEncoder();
      const byteLen = (obj) => encoder.encode(JSON.stringify(obj || [])).length;
      const breakdown = [
        { label: "Transaksi Penjualan", count: state.transactions.length, bytes: byteLen(state.transactions), color: "bg-rose-500" },
        { label: "Kas Harian", count: state.cashFlows.length, bytes: byteLen(state.cashFlows), color: "bg-amber-500" },
        { label: "Kas Utama Owner", count: state.ownerCashFlows.length, bytes: byteLen(state.ownerCashFlows), color: "bg-indigo-500" },
        { label: "Menu & Kategori", count: state.menus.length + state.categories.length, bytes: byteLen(state.menus) + byteLen(state.categories), color: "bg-emerald-500" },
        { label: "Pengguna & Pengaturan", count: state.users.length + 1, bytes: byteLen(state.users) + byteLen(state.settings), color: "bg-blue-500" }
      ];
      const usedBytes = breakdown.reduce((s, x) => s + x.bytes, 0);
      const totalQuotaBytes = IS_PREVIEW ? (50 * 1024 * 1024) : (1024 * 1024 * 1024);
      const freeBytes = Math.max(0, totalQuotaBytes - usedBytes);
      const usedPercent = Math.min(100, Number(((usedBytes / totalQuotaBytes) * 100).toFixed(3)));
      return { breakdown, usedBytes, freeBytes, totalQuotaBytes, usedPercent };
    }

    window.runDatabaseBackup = async () => {
      const inputUrl = document.getElementById("backup-folder-url")?.value.trim();
      const folderUrl = inputUrl !== undefined ? inputUrl : (state.settings.backupFolderUrl || "");
      state.isBackingUp = true;
      render();

      const nowStr = new Date().toLocaleString("id-ID");
      await dbSaveSettings({ backupFolderUrl: folderUrl, lastBackupAt: nowStr });

      const payload = {
        appName: state.settings.businessName,
        exportedAt: new Date().toISOString(),
        backupFolderUrl: folderUrl,
        settings: state.settings,
        categories: state.categories,
        menus: state.menus,
        transactions: state.transactions,
        cashFlows: state.cashFlows,
        ownerCashFlows: state.ownerCashFlows,
        users: state.users
      };

      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Backup_${(state.settings.businessName || "Usaha").replace(/\s+/g, "_")}_${todayIso()}.json`;
      a.click();

      setTimeout(() => {
        state.isBackingUp = false;
        render();
        if (folderUrl) {
          window.open(folderUrl, "_blank", "noopener,noreferrer");
          showToast("Backup Berhasil & Folder Dibuka", "File backup telah diunduh dan folder tujuan dibuka untuk diunggah.");
        } else {
          showToast("Backup Data Berhasil", "File backup JSON berhasil diunduh ke perangkat Anda.");
        }
      }, 650);
    };

    window.restoreDatabaseBackup = (input) => {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || (!parsed.transactions && !parsed.menus && !parsed.settings)) {
            return showToast("File Tidak Valid", "Format file backup JSON tidak dikenali.", "error");
          }
          showConfirmDialog({
            title: "Restore Data dari Backup",
            message: `Pulihkan data dari backup tanggal ${parsed.exportedAt ? parsed.exportedAt.slice(0, 10) : "-"}? Data saat ini akan diperbarui.`,
            confirmText: "Ya, Pulihkan Data",
            danger: false,
            onConfirm: async () => {
              if (Array.isArray(parsed.categories)) state.categories = parsed.categories;
              if (Array.isArray(parsed.menus)) state.menus = parsed.menus;
              if (Array.isArray(parsed.transactions)) state.transactions = parsed.transactions;
              if (Array.isArray(parsed.cashFlows)) state.cashFlows = parsed.cashFlows;
              if (Array.isArray(parsed.ownerCashFlows)) state.ownerCashFlows = parsed.ownerCashFlows;
              if (Array.isArray(parsed.users)) state.users = parsed.users;
              if (parsed.settings) await dbSaveSettings(parsed.settings);
              showToast("Restore Berhasil", "Seluruh data dari file backup telah dipulihkan.");
              render();
            }
          });
        } catch {
          showToast("Gagal Membaca File", "Pastikan file yang dipilih adalah file backup .json yang valid.", "error");
        }
      };
      reader.readAsText(file);
    };

    window.setUserPage = (p) => { state.userPage = p; render(); };
    window.selectAdminPerm = (id) => { state.selectedAdminId = id; render(); };
    window.openUserModal = (editId = null) => {
      const u = editId ? state.users.find(x => x.id === editId) : null;
      openModal(`
        <form onsubmit="window.saveUser(event, '${editId || ''}')" class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-base">${u ? "Edit Pengguna Admin" : "Tambah Pengguna Admin"}</h3>
            <button type="button" onclick="window.closeModal()" class="p-1.5 rounded-xl bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Username</label>
            <input id="usr-username" required value="${esc(u?.username || "")}" class="w-full px-3.5 py-2.5 rounded-xl border text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Nama Lengkap (Tercetak di Struk)</label>
            <input id="usr-fullname" required value="${esc(u?.fullName || "")}" class="w-full px-3.5 py-2.5 rounded-xl border text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Password</label>
            <input id="usr-pass" required value="${esc(u?.password || "")}" class="w-full px-3.5 py-2.5 rounded-xl border text-sm" />
          </div>
          <button type="submit" class="btn-micro w-full py-3 rounded-xl theme-gradient-btn text-white font-bold text-sm">Simpan Pengguna</button>
        </form>
      `);
    };
    window.saveUser = async (e, editId) => {
      e.preventDefault();
      const data = {
        username: document.getElementById("usr-username").value.trim(),
        fullName: document.getElementById("usr-fullname").value.trim(),
        password: document.getElementById("usr-pass").value,
        role: "Admin"
      };
      if (editId) {
        await dbUpdate("users", editId, data);
      } else {
        const created = await dbAdd("users", {
          ...data,
          status: "Aktif",
          templateName: "Kasir (Operasional)",
          permissions: { ...ACCESS_TEMPLATES["Kasir (Operasional)"] }
        });
        state.selectedAdminId = created.id;
      }
      window.closeModal();
      showToast("Pengguna Tersimpan", `Akun ${data.username} berhasil disimpan.`);
      render();
    };
    window.deleteUser = (id) => {
      showConfirmDialog({
        title: "Hapus Pengguna Admin",
        message: "Yakin ingin menghapus akun pengguna ini?",
        confirmText: "Ya, Hapus",
        onConfirm: async () => {
          await dbDelete("users", id);
          if (state.selectedAdminId === id) state.selectedAdminId = state.users[0]?.id || null;
          showToast("Pengguna Dihapus", "", "warning");
          render();
        }
      });
    };
    window.toggleAdminStatus = async (id, checked) => {
      const status = checked ? "Aktif" : "Nonaktif";
      await dbUpdate("users", id, { status });
      showToast("Status Diperbarui", `Akun kini ${status}.`, "info");
      render();
    };
    window.applyTemplateToAdmin = async (id) => {
      const tpl = document.getElementById("perm-template-select")?.value;
      if (!tpl || !ACCESS_TEMPLATES[tpl]) return showToast("Pilih Template", "Gunakan salah satu template baku.", "info");
      await dbUpdate("users", id, { templateName: tpl, permissions: { ...ACCESS_TEMPLATES[tpl] } });
      showToast("Template Diterapkan", `Izin diubah ke ${tpl}.`);
      render();
    };
    window.resetAdminPerms = async (id) => {
      const empty = Object.fromEntries(PERMISSION_GROUPS.flatMap(g => g.items.map(i => [i.key, false])));
      await dbUpdate("users", id, { templateName: "Kustom (Manual)", permissions: empty });
      showToast("Izin Direset", "Semua checklist izin dikosongkan.", "warning");
      render();
    };
    window.saveAdminPerms = async (id) => {
      const perms = {};
      document.querySelectorAll("[data-perm-key]").forEach(cb => {
        perms[cb.getAttribute("data-perm-key")] = cb.checked;
      });
      await dbUpdate("users", id, { templateName: "Kustom (Manual)", permissions: perms });
      showToast("Hak Akses Disimpan", "Perubahan izin Admin berhasil diperbarui.");
      render();
    };

    // PENGATURAN SISTEM
    window.saveSystemSettings = async (e) => {
      e.preventDefault();
      const methods = Array.from(document.querySelectorAll('input[name="pay_methods"]:checked')).map(c => c.value);
      const themeEl = document.querySelector('input[name="themeColor"]:checked');
      await dbSaveSettings({
        businessName: document.getElementById("set-name").value.trim(),
        whatsappOwner: document.getElementById("set-wa").value.trim(),
        logoUrl: document.getElementById("set-logo-url").value.trim(),
        qrisImageUrl: document.getElementById("set-qris-url").value.trim(),
        bankInfo: document.getElementById("set-bank").value.trim(),
        ewalletInfo: document.getElementById("set-ewallet").value.trim(),
        autoSendReceiptWa: Boolean(document.getElementById("set-auto-wa")?.checked),
        receiptShowLogo: Boolean(document.getElementById("set-receipt-logo")?.checked),
        receiptShowCashier: Boolean(document.getElementById("set-receipt-cashier")?.checked),
        receiptHeaderName: document.getElementById("set-receipt-header")?.value.trim() || document.getElementById("set-name").value.trim(),
        receiptAddress: document.getElementById("set-receipt-addr")?.value.trim() || "",
        receiptFooter: document.getElementById("set-receipt-footer")?.value.trim() || "Terima Kasih Sudah Berbelanja!",
        paymentMethods: methods.length ? methods : ["Tunai"],
        themeColor: themeEl ? themeEl.value : state.settings.themeColor
      });
      showToast("Pengaturan Disimpan", "Identitas usaha, struk & tema berhasil diperbarui.");
      render();
    };

    // RENDER ENGINE & AUTO-ROLLOVER TANGGAL
    function render() {
      const root = document.getElementById("main-view");
      if (!root) return;
      root.innerHTML = state.user ? renderAppShell() : renderLogin();
      safeIcons();
    }

    let _activeDateStr = todayIso();
    setInterval(() => {
      const nowDate = todayIso();
      if (nowDate !== _activeDateStr) {
        _activeDateStr = nowDate;
        state.trxFilterDate = nowDate;
        state.trxFilterMonth = nowDate.slice(0, 7);
        state.trxFilterYear = nowDate.slice(0, 4);
        if (state.user) render();
      }
    }, 30000);

    async function boot() {
      if (IS_PREVIEW) {
        loadPreviewData();
      } else {
        await initFirebaseIfProd();
      }
      applyTheme(state.settings.themeColor);
      render();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
